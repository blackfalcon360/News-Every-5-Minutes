plugins {
    id 'com.android.application'
}

android {
    namespace 'news.blackfalcon.jan'
    compileSdk 34

    defaultConfig {
        applicationId "news.blackfalcon.jan"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
